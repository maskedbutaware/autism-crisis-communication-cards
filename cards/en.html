<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Communication card for sensory overload</title>
    <meta
      name="description"
      content="Printable communication card for moments when sensory overload makes speaking difficult."
    />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <main>
      <p class="intro">Choose the phrases that fit before you need them. Print the card or keep it on your phone.</p>
      <section class="card" aria-labelledby="card-title">
        <h1 id="card-title">I am overloaded</h1>
        <p class="lead">Speaking is difficult right now. This helps me:</p>

        <label class="phrase"><input type="checkbox" /> Give me space and do not ask questions yet.</label>
        <label class="phrase"><input type="checkbox" /> Lower the noise if you can.</label>
        <label class="phrase"><input type="checkbox" /> Do not touch me unexpectedly.</label>
        <label class="phrase"><input type="checkbox" /> Help me reach a quieter place.</label>
        <label class="phrase"><input type="checkbox" /> Stay nearby without talking too much.</label>
        <label class="phrase"><input type="checkbox" /> I will return to this decision later.</label>

        <p class="note"><strong>Immediate danger:</strong> contact the local emergency service or a person nearby.</p>
        <p class="source">
          Interactive version:
          <a href="https://www.maskedbutaware.nl/en/tools/crisis-mode">Crisis Mode for sensory overload</a>
        </p>
      </section>
    </main>
  </body>
</html>
