<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Communicatiekaart bij overprikkeling</title>
    <meta
      name="description"
      content="Printbare communicatiekaart voor momenten waarop overprikkeling praten moeilijk maakt."
    />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <main>
      <p class="intro">Vink vooraf aan welke zinnen bij jou passen. Print de kaart of bewaar hem op je telefoon.</p>
      <section class="card" aria-labelledby="card-title">
        <h1 id="card-title">Ik ben overprikkeld</h1>
        <p class="lead">Praten lukt nu niet goed. Dit helpt mij:</p>

        <label class="phrase"><input type="checkbox" /> Geef me ruimte en stel even geen vragen.</label>
        <label class="phrase"><input type="checkbox" /> Verminder het geluid als dat kan.</label>
        <label class="phrase"><input type="checkbox" /> Raak me niet onverwacht aan.</label>
        <label class="phrase"><input type="checkbox" /> Help me naar een rustigere plek.</label>
        <label class="phrase"><input type="checkbox" /> Blijf in de buurt zonder veel te praten.</label>
        <label class="phrase"><input type="checkbox" /> Ik kom later terug op deze beslissing.</label>

        <p class="note"><strong>Bij direct gevaar:</strong> neem contact op met 112 of een aanwezige hulpverlener.</p>
        <p class="source">
          Interactieve versie:
          <a href="https://www.maskedbutaware.nl/tools/crisis-modus">Crisis Modus bij overprikkeling</a>
        </p>
      </section>
    </main>
  </body>
</html>
